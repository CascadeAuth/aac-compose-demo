agent_name: trip-planner
workload_path: trip-planner
tls_server_names: [trip-planner, localhost, 127.0.0.1]
sidecar:
  dev_mode: false
  external_bind_address: 0.0.0.0
  agent_invoke_url: http://127.0.0.1:8000/invoke
  telemetry:
    sink: telemetry.jsonl
    central_forward: false
replay_protection:
  backend: memory
  deployment_profile: basic
classes_of_action:
  reserve_travel:
    predicates:
      action: reserve_travel
    valid_for: +2h
# Register first. Then explicitly add peer trust and the tourfedia destination
# to your copy of this input, using the booking agent's actual status output.
