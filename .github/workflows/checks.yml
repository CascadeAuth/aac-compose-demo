name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    # Everything that needs no tenant: the sample agent and client against
    # test doubles, the compose file against a synthetic workspace, the
    # README's commands against the CLI parser, and the shell script.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet -r tests/requirements.txt
      - run: sudo apt-get install -y -q shellcheck
      - run: shellcheck starter
      - run: python -m pytest tests -q --ignore tests/live
