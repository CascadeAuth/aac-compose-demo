name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    # Everything that needs no tenant: the sample agent and client against
    # test doubles, the compose file against a synthetic agent, the
    # README's commands against the CLI parser, and the shell script.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet -r tests/requirements.txt
      - run: python -m py_compile demo agent/*.py tests/fixtures/*.py
      - run: python -m pytest tests -q --ignore tests/live
      # The sample agent image must build from a clean checkout.
      - run: docker build --quiet agent
