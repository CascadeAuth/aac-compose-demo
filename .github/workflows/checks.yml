name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    # Everything that needs no tenant: the sample agent and client against
    # test doubles, the compose file against a synthetic agent, the
    # README's commands against the CLI parser, and the shell script.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # This consumer activates after its required public CLI release.
      - run: |
          python -m venv .venv
          source .venv/bin/activate
          ./demo prepare --tests
          python -m py_compile demo agent/*.py tests/fixtures/*.py
          python -m pytest tests -q --ignore tests/live
          docker build --quiet --build-arg AAC_INVOKE_AUTH_VERSION=$(python components.py --invoke-version) agent
