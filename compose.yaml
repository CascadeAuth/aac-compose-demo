# AAC Compose starter — the tenant-local half of an Agent Authority Cloud
# workload: your sample agent, the AAC sidecar beside it, and the tenant's
# trust-anchor publisher. The control plane is the hosted AAC stage service;
# nothing here runs or replaces it.
#
# Every ${AAC_*} value comes from the compose.env that `aac init` writes for
# the workspace (~/.aac/workspaces/<name>/compose.env). Run the stack through
# ./starter, which passes that file with --env-file and exports
# AAC_STARTER_UID/AAC_STARTER_GID so the containers run as you and can read
# the private files `aac init` created with mode 0600.

name: aac-starter

x-runtime: &runtime
  user: "${AAC_STARTER_UID:?run this stack through ./starter}:${AAC_STARTER_GID:?run this stack through ./starter}"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

# The pairing secret and the development CA certificate: what the sidecar and
# its paired agent share. Nothing private to the sidecar alone lives here.
x-pair-volume: &pair-volume
  type: bind
  source: ${AAC_WORKSPACE_PAIR_DIR:?compose.env from `aac init` is required}
  target: /run/secrets
  read_only: true

services:
  # Your workload. A small FastAPI application that verifies the sidecar's
  # pairing signature on every call and returns the decisions AAC executes.
  # Replace agent/agent.py with your own handler after the first success.
  agent:
    build:
      context: ./agent
      args:
        AAC_INVOKE_AUTH_VERSION: ${AAC_INVOKE_AUTH_VERSION:-0.1.2}
    image: aac-compose-starter-agent:local
    <<: *runtime
    tmpfs: [/tmp]
    environment:
      AAC_INVOKE_AUTH_SECRET_FILE: /run/secrets/pairing.secret
    volumes:
      - *pair-volume
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  # The AAC sidecar, joined to the agent's network namespace so the rendered
  # configuration's 127.0.0.1 addresses hold: the agent on :8000, the sidecar
  # loopback API on :8080 and its TLS listener on :9443, none published to
  # the host. The image is the published one; it is never rebuilt here.
  sidecar:
    image: docker.io/cascadeauth/aac-sidecar:${AAC_SIDECAR_VERSION:-v0.2.0}
    <<: *runtime
    network_mode: "service:agent"
    depends_on:
      agent:
        condition: service_healthy
    command: ["-config", "/etc/aac/sidecar-config.yaml"]
    volumes:
      - type: bind
        source: ${AAC_SIDECAR_CONFIG_FILE:?}
        target: /etc/aac/sidecar-config.yaml
        read_only: true
      - type: bind
        source: ${AAC_WORKSPACE_PKI_DIR:?}
        target: /etc/aac/pki
        read_only: true
      # The two secrets the rendered configuration reads under /run/secrets,
      # mounted one file each: a file cannot be mounted inside a directory
      # that is itself a read-only mount, and the API key lives outside pair/.
      - type: bind
        source: ${AAC_WORKSPACE_PAIR_DIR:?}/pairing.secret
        target: /run/secrets/pairing.secret
        read_only: true
      - type: bind
        source: ${AAC_API_KEY_FILE:?}
        target: /run/secrets/tenant-api-key
        read_only: true
      # Retained state: the local telemetry sink and the A2A retry results.
      # Survives stop, start, recreate and rebuild because it lives in the
      # workspace, not in the container.
      - type: bind
        source: ${AAC_WORKSPACE_STATE_DIR:?}
        target: /var/lib/aac

  # The tenant's trust-anchor publisher: signs the workspace's PUBLIC root key
  # and development CA certificate with the tenant-admin key and uploads them
  # to AAC, where the sidecar (and any peer) fetches them. It publishes at
  # start-up and then only when a file changes. One publisher per tenant.
  publisher:
    image: ghcr.io/cascadeauth/aac-trust-anchor-publisher:${AAC_PUBLISHER_VERSION:-0.2.3}
    <<: *runtime
    tmpfs: [/tmp]
    restart: unless-stopped
    environment:
      AAC_TAP_TENANT_ID: ${AAC_TENANT_ID:?}
      AAC_TAP_ADMIN_KEY_FILE: /keys/tenant-admin.pem
      AAC_TAP_ROOT_KEYS_DIR: /root-keys
      AAC_TAP_ROOT_KEYS_INGEST_URL: ${AAC_DATA_PLANE_URL:?}/v1/root-keys/ingest
      AAC_TAP_SPIFFE_BUNDLE_DIR: /spiffe-bundle
      AAC_TAP_SPIFFE_BUNDLE_INGEST_URL: ${AAC_DATA_PLANE_URL:?}/v1/spiffe-bundle/ingest
      AAC_TAP_SPIFFE_TRUST_DOMAIN: ${AAC_TRUST_DOMAIN:?}
      AAC_TAP_SPIFFE_BUNDLE_READ_URL: ${AAC_TRUST_URL:?}/.well-known/spiffe-bundle/${AAC_TRUST_DOMAIN:?}
      AAC_TAP_POLL_INTERVAL_SECONDS: "60"
    volumes:
      - type: bind
        source: ${AAC_TENANT_DIR:?}/tenant-admin.pem
        target: /keys/tenant-admin.pem
        read_only: true
      - type: bind
        source: ${AAC_TENANT_DIR:?}/root-keys
        target: /root-keys
        read_only: true
      - type: bind
        source: ${AAC_TENANT_DIR:?}/spiffe-bundle
        target: /spiffe-bundle
        read_only: true

  # The example client. Not part of `up`; `./starter exercise` runs it once
  # inside the agent's network namespace, where the sidecar's local APIs are.
  client:
    image: aac-compose-starter-agent:local
    <<: *runtime
    profiles: [exercise]
    network_mode: "service:agent"
    depends_on:
      agent:
        condition: service_healthy
    tmpfs: [/tmp]
    environment:
      AAC_INVOKE_AUTH_SECRET_FILE: /run/secrets/pairing.secret
      AAC_STARTER_CA_FILE: /run/secrets/dev-ca.crt
      AAC_STARTER_EXERCISE_DIR: /exercise
      AAC_STARTER_TELEMETRY_FILE: /var/lib/aac/telemetry.jsonl
    volumes:
      - *pair-volume
      - type: bind
        source: ${AAC_WORKSPACE_STATE_DIR:?}
        target: /var/lib/aac
        read_only: true
      - type: bind
        source: ${AAC_STARTER_EXERCISE_DIR:?run this stack through ./starter}
        target: /exercise
    entrypoint: ["python", "/app/client.py"]
    command: ["exercise"]
